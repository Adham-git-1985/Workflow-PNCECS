<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>معاينة {{ file.original_name }}</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f8fafc;
      color: #1f2937;
      font-family: "Tajawal", "Segoe UI", Tahoma, Arial, sans-serif;
    }
    .panel {
      width: min(560px, calc(100% - 32px));
      padding: 28px;
      text-align: center;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      background: #ffffff;
      box-shadow: 0 16px 36px rgba(15, 23, 42, 0.08);
    }
    .file-name {
      margin-bottom: 8px;
      font-weight: 700;
      overflow-wrap: anywhere;
    }
    .meta {
      margin-bottom: 18px;
      color: #64748b;
      font-size: 13px;
    }
    .message {
      margin-bottom: 22px;
      line-height: 1.8;
    }
    .download-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 120px;
      border: 1px solid #0d6efd;
      border-radius: 8px;
      padding: 9px 16px;
      color: #ffffff;
      text-decoration: none;
      background: #0d6efd;
    }
  </style>
</head>
<body>
  <div class="panel">
    <div class="file-name">{{ file.original_name }}</div>
    <div class="meta">
      {% if file_ext %}نوع الملف: {{ file_ext }}{% endif %}
      {% if mime_type %} · {{ mime_type }}{% endif %}
    </div>
    <div class="message">
      لا يمكن عرض هذا النوع داخل المتصفح مباشرة أو استخراج نصه للمعاينة.
      يمكنك تنزيل الملف وفتحه بالبرنامج المناسب على جهازك.
    </div>
    <a class="download-link" href="{{ url_for(download_endpoint, file_id=file.id) }}" target="_blank">تنزيل الملف</a>
  </div>
</body>
</html>
