<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>معاينة {{ file.original_name }}</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      background: #f8fafc;
      color: #1f2937;
      font-family: "Tajawal", "Segoe UI", Tahoma, Arial, sans-serif;
    }
    .preview-toolbar {
      position: sticky;
      top: 0;
      z-index: 1;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 12px 16px;
      background: #ffffff;
      border-bottom: 1px solid #e5e7eb;
      box-shadow: 0 1px 10px rgba(15, 23, 42, 0.06);
    }
    .preview-title {
      min-width: 0;
      overflow-wrap: anywhere;
      font-weight: 700;
    }
    .preview-actions {
      display: flex;
      gap: 8px;
      align-items: center;
      color: #64748b;
      font-size: 13px;
    }
    .download-link {
      display: inline-flex;
      align-items: center;
      border: 1px solid #0d6efd;
      border-radius: 8px;
      padding: 6px 12px;
      color: #0d6efd;
      text-decoration: none;
      background: #ffffff;
    }
    .notice {
      margin: 12px 16px 0;
      padding: 10px 12px;
      border: 1px solid #bfdbfe;
      border-radius: 10px;
      color: #1e40af;
      background: #eff6ff;
      font-size: 14px;
    }
    pre {
      margin: 16px;
      padding: 16px;
      min-height: 520px;
      overflow: auto;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      background: #ffffff;
      line-height: 1.75;
      font-family: "Courier New", Consolas, Tahoma, monospace;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="preview-toolbar">
    <div class="preview-title">{{ file.original_name }}</div>
    <div class="preview-actions">
      <span>معاينة نصية</span>
      <a class="download-link" href="{{ url_for(download_endpoint, file_id=file.id) }}" target="_blank">تنزيل</a>
    </div>
  </div>

  {% if preview_note %}
    <div class="notice">{{ preview_note }}</div>
  {% endif %}

  {% if truncated %}
    <div class="notice">تم عرض جزء من الملف فقط لأن حجمه كبير.</div>
  {% endif %}

  <pre dir="auto">{{ preview_text or "لم يتم العثور على نص قابل للعرض في هذا الملف." }}</pre>
</body>
</html>
