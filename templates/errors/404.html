{% extends "layout.html" %}

{% block title %}{{ page_title }}{% endblock %}

{% block content %}

<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">
      <div class="card shadow-sm">
        <div class="card-body text-center p-4">
          <div class="display-6 mb-2 text-secondary"><i class="bi bi-file-earmark-x"></i></div>
          <div class="text-muted small mb-2">404</div>
          <h4 class="mb-2">{{ page_title }}</h4>
          <p class="text-muted mb-4">{{ message }}</p>

          <div class="d-flex gap-2 justify-content-center flex-wrap">
            <a class="btn btn-outline-secondary" href="javascript:history.back()">رجوع</a>
            {% if current_user.is_authenticated %}
              <a class="btn btn-primary" href="{{ url_for('workflow.inbox') }}">العودة إلى صندوق المهام</a>
            {% else %}
              <a class="btn btn-primary" href="{{ url_for('login') }}">تسجيل الدخول</a>
            {% endif %}
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

{% endblock %}
