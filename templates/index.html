<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>الرئيسية</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            font-family: "Sakkal Majalla", "Traditional Arabic", Tahoma, Arial, sans-serif;
            background: linear-gradient(135deg, #f8f9fa, #e9ecef);
            min-height: 100vh;
        }
        .welcome-card {
            border-radius: 16px;
        }
        .welcome-icon {
            font-size: 3rem;
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center">

<div class="container" style="max-width:500px">
    <div class="card shadow-lg welcome-card text-center">
        <div class="card-body py-5">
            <div class="welcome-icon mb-3">✅</div>
            <h4 class="mb-2">تم تسجيل الدخول بنجاح</h4>
            <p class="text-muted mb-4">
                أهلاً بك<br>
                <strong>{{ current_user.email }}</strong>
            </p>

            <div class="d-grid gap-2">
                <a href="{{ url_for('inbox') }}" class="btn btn-primary">
                    📥 الذهاب إلى صندوق الوارد
                </a>
                <a href="{{ url_for('my_requests') }}" class="btn btn-outline-secondary">
                    📂 عرض طلباتي
                </a>
                <a href="{{ url_for('logout') }}" class="btn btn-link text-danger">
                    تسجيل الخروج
                </a>
            </div>
        </div>
    </div>
</div>

</body>
</html>
