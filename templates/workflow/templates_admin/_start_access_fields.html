<div class="col-12">
  <div class="border rounded-3 p-3 bg-light-subtle">
    <div class="fw-bold mb-1">من يستطيع بدء هذا المسار؟</div>
    <div class="small text-muted mb-3">
      هذه الصلاحية تمنع بدء المسار فقط، ولا تغيّر صلاحية الاطلاع على الطلبات بعد إنشائها.
      يمكن الجمع بين أكثر من إدارة عامة أو دائرة أو قسم أو شخص محدد.
    </div>

    <label class="form-label fw-semibold" for="startAccessMode">نطاق صلاحية البدء</label>
    <select class="form-select" name="start_access_mode" id="startAccessMode">
      <option value="NONE" {% if start_access_data.mode == 'NONE' %}selected{% endif %}>لا أحد</option>
      <option value="ALL" {% if start_access_data.mode == 'ALL' %}selected{% endif %}>الجميع</option>
      <option value="SELECTED" {% if start_access_data.mode == 'SELECTED' %}selected{% endif %}>جهات وأشخاص محددون (مع إمكانية الجمع)</option>
    </select>

    <div id="startAccessTargets" class="mt-3 {% if start_access_data.mode != 'SELECTED' %}d-none{% endif %}">
      <div class="row g-3">
        <div class="col-lg-3 col-md-6">
          <label class="form-label">إدارات عامة</label>
          <select class="form-select" name="start_directorate_ids" multiple size="6">
            {% for directorate in start_access_options.directorates %}
              <option value="{{ directorate.id }}" {% if directorate.id in start_access_data.directorate_ids %}selected{% endif %}>
                {{ directorate.name_ar }}{% if directorate.code %} ({{ directorate.code }}){% endif %}
              </option>
            {% endfor %}
          </select>
        </div>

        <div class="col-lg-3 col-md-6">
          <label class="form-label">دوائر</label>
          <select class="form-select" name="start_department_ids" multiple size="6">
            {% for department in start_access_options.departments %}
              <option value="{{ department.id }}" {% if department.id in start_access_data.department_ids %}selected{% endif %}>
                {{ department.name_ar }}{% if department.code %} ({{ department.code }}){% endif %}
              </option>
            {% endfor %}
          </select>
        </div>

        <div class="col-lg-3 col-md-6">
          <label class="form-label">أقسام</label>
          <select class="form-select" name="start_section_ids" multiple size="6">
            {% for section in start_access_options.sections %}
              <option value="{{ section.id }}" {% if section.id in start_access_data.section_ids %}selected{% endif %}>
                {{ section.name_ar }}{% if section.code %} ({{ section.code }}){% endif %}
              </option>
            {% endfor %}
          </select>
        </div>

        <div class="col-lg-3 col-md-6">
          <label class="form-label">أشخاص محددون</label>
          <select class="form-select" name="start_user_ids" multiple size="6">
            {% for user in start_access_options.users %}
              <option value="{{ user.id }}" {% if user.id in start_access_data.user_ids %}selected{% endif %}>
                {{ user.full_name }}{% if user.email %} — {{ user.email }}{% endif %}
              </option>
            {% endfor %}
          </select>
        </div>
      </div>
      <div class="form-text">للتحديد المتعدد استخدم Ctrl أو ⌘ أثناء الاختيار.</div>
    </div>
  </div>
</div>

<script>
  (function () {
    const mode = document.getElementById('startAccessMode');
    const targets = document.getElementById('startAccessTargets');
    if (!mode || !targets) return;
    const sync = function () {
      targets.classList.toggle('d-none', mode.value !== 'SELECTED');
    };
    mode.addEventListener('change', sync);
    sync();
  })();
</script>
