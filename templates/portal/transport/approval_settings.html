{% extends "portal/layout.html" %}
{% block title %}مسؤولو اعتماد الحركة{% endblock %}
{% block content %}
{% include "portal/transport/_nav.html" %}
<div class="d-flex align-items-center justify-content-between mb-3"><h5 class="mb-0"><i class="bi bi-person-gear"></i> مسؤولو اعتماد طلبات الحركة</h5></div>
<div class="bg-white rounded-3 shadow-sm p-3">
  <div class="alert alert-info">اختر المسؤولين بالاسم. عند عدم اختيار مسؤول الحركة، يستخدم النظام مدير النقل البديل المحدد هنا.</div>
  <form method="post" class="row g-3">
    <div class="col-md-4"><label class="form-label">مسؤول الحركة والنقل</label><select class="form-select" name="transport_manager_user_id"><option value="">غير محدد</option>{% for user in users %}<option value="{{ user.id }}" {% if transport_manager_user_id == user.id %}selected{% endif %}>{{ user.name or user.email }}</option>{% endfor %}</select></div>
    <div class="col-md-4"><label class="form-label">مدير النقل البديل</label><select class="form-select" name="transport_director_user_id"><option value="">غير محدد</option>{% for user in users %}<option value="{{ user.id }}" {% if transport_director_user_id == user.id %}selected{% endif %}>{{ user.name or user.email }}</option>{% endfor %}</select></div>
    <div class="col-md-4"><label class="form-label">مدير الشؤون الإدارية</label><select class="form-select" name="transport_admin_user_id"><option value="">غير محدد</option>{% for user in users %}<option value="{{ user.id }}" {% if transport_admin_user_id == user.id %}selected{% endif %}>{{ user.name or user.email }}</option>{% endfor %}</select></div>
    <div class="col-12"><button class="btn btn-primary">حفظ المسؤولين</button></div>
  </form>
</div>
{% endblock %}
