{% extends "portal/layout.html" %}
{% block title %}تذكرة دعم جديدة{% endblock %}
{% block content %}
<div class="p-4 bg-white rounded-3 shadow-sm mx-auto" style="max-width:850px">
  <div class="d-flex justify-content-between align-items-start gap-2"><div><h4 class="mb-1"><i class="bi bi-life-preserver"></i> تذكرة دعم جديدة</h4><p class="text-muted mb-0">اشرح المشكلة بوضوح، وأضف رسالة الخطأ أو الخطوات التي أدت إليها إن وجدت.</p></div><a class="btn btn-outline-secondary" href="{{ url_for('portal.trouble_tickets') }}">رجوع</a></div>
  <form method="post" enctype="multipart/form-data" class="mt-4"><div class="row g-3"><div class="col-12"><label class="form-label">عنوان المشكلة <span class="text-danger">*</span></label><input class="form-control" name="subject" maxlength="250" required value="{{ request.form.get('subject','') }}" placeholder="مثال: لا يمكن اعتماد الطلب"></div><div class="col-md-6"><label class="form-label">التصنيف</label><select class="form-select" name="category">{% for code, label in categories.items() %}<option value="{{ code }}">{{ label }}</option>{% endfor %}</select></div><div class="col-md-6"><label class="form-label">الأولوية</label><select class="form-select" name="priority">{% for code, label in priorities.items() %}<option value="{{ code }}">{{ label }}</option>{% endfor %}</select></div><div class="col-12"><label class="form-label">وصف المشكلة <span class="text-danger">*</span></label><textarea class="form-control" name="description" rows="7" required placeholder="ماذا حدث؟ ما الذي كنت تحاول إنجازه؟">{{ request.form.get('description','') }}</textarea></div><div class="col-12"><label class="form-label">مرفقات (اختياري)</label><input class="form-control" type="file" name="attachments" multiple accept="image/*,.pdf"><div class="form-text">يمكن رفع صور أو ملفات متعددة، بحد أقصى 10 ملفات و50 م.ب إجمالاً.</div></div></div><div class="mt-4 d-flex gap-2"><button class="btn btn-primary" type="submit"><i class="bi bi-send"></i> إرسال التذكرة</button><a class="btn btn-light" href="{{ url_for('portal.trouble_tickets') }}">إلغاء</a></div></form>
</div>
{% endblock %}
